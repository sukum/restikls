<div x-data id="modal_container">

                </svg>
            </button>
            <div x-html="$store.modal.html" class="p-4 m-2"></div>
            <div x-cloak x-show="!$store.modal.html" id="modal_div" class="p-4 m-2 bg-white"></div>
        </div>
    </div>
</div>
