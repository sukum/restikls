[project]
name = "restikls"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography==50.0.2",
    "flask~=3.1.3",
    "flask-caching~=2.4.1",
    "werkzeug~=3.1.0",
    "gunicorn~=26.2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "waitress>=3.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
search_path = [
    "src/"
]

[tool.uv]
no-build = true

[project.scripts]
restikls = "restikls:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
